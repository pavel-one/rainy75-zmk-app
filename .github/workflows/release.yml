name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  WAILS_VERSION: v3.0.0

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            task: darwin:package:universal
            asset: rainy75-macos-universal.zip
          - name: Windows
            os: windows-latest
            task: windows:build
            asset: rainy75-windows-amd64.zip
          - name: Linux
            os: ubuntu-24.04
            task: linux:create:deb
            asset: rainy75-linux-amd64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Set version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          sed -i.bak "s/0\.1\.0/$version/g" build/darwin/Info.plist build/windows/info.json build/linux/nfpm/nfpm.yaml
          rm -f build/darwin/Info.plist.bak build/windows/info.json.bak build/linux/nfpm/nfpm.yaml.bak

      - name: Build
        run: wails3 task ${{ matrix.task }}

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mv bin/rainy75.app bin/Rainy75.app
          ditto -c -k --keepParent bin/Rainy75.app "../${{ matrix.asset }}"

      - name: Package Windows
        if: runner.os == 'Windows'
        run: 7z a "../${{ matrix.asset }}" ./bin/rainy75.exe

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          tar -czf "../${{ matrix.asset }}" -C bin rainy75
          cp bin/*.deb "../rainy75_${VERSION}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.asset }}
            *.deb
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Rainy75 ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
